<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E1411"/>
      <stop offset="100%" stop-color="#080C0A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00FF88" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00FF88" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- Subtle corner ticks (industrial/technical feel) -->
  <g stroke="#1F2A24" stroke-width="2" fill="none">
    <path d="M 40 40 L 70 40 M 40 40 L 40 70"/>
    <path d="M 472 40 L 442 40 M 472 40 L 472 70"/>
    <path d="M 40 472 L 70 472 M 40 472 L 40 442"/>
    <path d="M 472 472 L 442 472 M 472 472 L 472 442"/>
  </g>

  <!-- Pipe cross-section ring (representing aqueduc) -->
  <circle cx="256" cy="220" r="92" fill="none" stroke="#00FF88" stroke-width="6" filter="url(#neonGlow)"/>
  <circle cx="256" cy="220" r="74" fill="none" stroke="#00FF88" stroke-width="2" opacity="0.4"/>

  <!-- Water droplet inside pipe (the "leak" concept) -->
  <path d="M 256 188 C 256 188, 230 218, 230 238 C 230 252.4, 241.6 264, 256 264 C 270.4 264, 282 252.4, 282 238 C 282 218, 256 188, 256 188 Z"
        fill="#00FF88" filter="url(#neonGlow)"/>

  <!-- "L" mark for Leakage / Litres - in monospace style -->
  <text x="256" y="400"
        font-family="'Share Tech Mono', 'Courier New', monospace"
        font-size="72"
        font-weight="700"
        fill="#E8F0EA"
        text-anchor="middle"
        letter-spacing="6">L=Q/t</text>

  <!-- SMD tag -->
  <text x="256" y="450"
        font-family="'Share Tech Mono', 'Courier New', monospace"
        font-size="20"
        fill="#7C8C82"
        text-anchor="middle"
        letter-spacing="6">SMD</text>
</svg>
