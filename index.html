<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#080C0A">
<title>Perte Admissible · SMD</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Perte Adm.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080C0A;
  --bg-2:#0E1411;
  --surface:#121916;
  --surface-2:#1A221E;
  --border:#1F2A24;
  --neon:#00FF88;
  --neon-dim:#00cc6e;
  --neon-glow:rgba(0,255,136,.18);
  --text:#E8F0EA;
  --muted:#7C8C82;
  --warn:#FF4D4D;
  --amber:#FFB627;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:'Barlow Condensed',sans-serif;font-weight:400;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body{
  min-height:100vh;
  background:
    radial-gradient(ellipse at top right, rgba(0,255,136,.04), transparent 50%),
    radial-gradient(ellipse at bottom left, rgba(0,255,136,.03), transparent 50%),
    var(--bg);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 16px) env(safe-area-inset-left);
}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.025;z-index:1;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

header{
  padding:22px 20px 18px;
  border-bottom:1px solid var(--border);
  position:relative;
  z-index:2;
}
.header-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{
  width:34px;height:34px;border:1.5px solid var(--neon);
  display:grid;place-items:center;
  font-family:'Share Tech Mono',monospace;color:var(--neon);
  font-size:14px;font-weight:700;
  box-shadow:0 0 12px var(--neon-glow);
  flex-shrink:0;
}
.brand-text{display:flex;flex-direction:column;line-height:1;min-width:0}
.brand-text .top{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:2px}
.brand-text .bot{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:1px}

/* Language toggle */
.lang-toggle{
  display:flex;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:4px;
  overflow:hidden;
  font-family:'Share Tech Mono',monospace;
  font-size:11px;
  letter-spacing:1.5px;
  flex-shrink:0;
}
.lang-toggle button{
  background:transparent;
  border:0;
  color:var(--muted);
  padding:9px 14px;
  cursor:pointer;
  text-transform:uppercase;
  font-family:inherit;
  font-size:inherit;
  letter-spacing:inherit;
  transition:all .15s;
  font-weight:700;
  min-width:42px;
}
.lang-toggle button.active{
  background:var(--neon);
  color:#000;
}
.lang-toggle button:not(.active):hover{
  color:var(--text);
}

h1{
  margin-top:14px;
  font-weight:800;
  font-size:30px;
  text-transform:uppercase;
  letter-spacing:.5px;
  line-height:.95;
}
h1 .accent{color:var(--neon);text-shadow:0 0 18px var(--neon-glow)}

main{padding:18px 16px 100px;position:relative;z-index:2;max-width:580px;margin:0 auto}

.norm-section{margin-bottom:18px}
.section-label{
  font-family:'Share Tech Mono',monospace;
  font-size:10px;color:var(--muted);
  letter-spacing:2px;text-transform:uppercase;
  margin-bottom:6px;
}
.select-wrap{
  position:relative;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:4px;
  overflow:hidden;
}
.select-wrap::after{
  content:'▾';
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  color:var(--neon);font-size:14px;pointer-events:none;
}
select{
  width:100%;
  background:transparent;
  border:0;
  color:var(--text);
  font-family:'Barlow Condensed',sans-serif;
  font-weight:600;
  font-size:17px;
  padding:14px 38px 14px 14px;
  letter-spacing:.5px;
  -webkit-appearance:none;appearance:none;
  cursor:pointer;
}
select:focus{outline:0;box-shadow:inset 0 0 0 2px var(--neon)}
select option{background:var(--surface);color:var(--text)}
optgroup{font-family:'Share Tech Mono',monospace;color:var(--neon);font-size:11px;letter-spacing:1px;font-style:normal}

.norm-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-left:3px solid var(--neon);
  padding:14px;
  border-radius:4px;
  animation:fadeIn .25s ease;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

.norm-title{
  font-family:'Barlow Condensed',sans-serif;
  font-weight:700;font-size:16px;
  text-transform:uppercase;letter-spacing:1px;
  color:var(--text);
  margin-bottom:4px;
}
.norm-context{
  font-family:'Share Tech Mono',monospace;
  font-size:10px;color:var(--neon);
  letter-spacing:1.5px;text-transform:uppercase;
  margin-bottom:10px;
}
.norm-formula{
  background:var(--bg-2);
  border:1px dashed var(--border);
  padding:11px 13px;
  font-family:'Share Tech Mono',monospace;
  font-size:14px;color:var(--text);
  margin:8px 0;
  letter-spacing:.5px;
  word-break:break-word;
}
.norm-formula .neon{color:var(--neon)}
.norm-desc{
  font-size:14.5px;
  color:var(--text);
  line-height:1.45;
  opacity:.92;
  margin-bottom:8px;
}
.var-list{margin-top:8px;font-size:14px;line-height:1.5}
.var-list .v{display:flex;gap:8px;margin-bottom:3px}
.var-list .sym{
  font-family:'Share Tech Mono',monospace;
  color:var(--neon);font-weight:700;
  min-width:38px;flex-shrink:0;
}
.var-list .def{color:var(--text);opacity:.85}

.field{margin-bottom:14px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{
  display:block;
  font-size:12px;text-transform:uppercase;letter-spacing:1.5px;
  color:var(--muted);font-weight:500;
  margin-bottom:5px;
  font-family:'Share Tech Mono',monospace;
}
.input-wrap{position:relative}
input[type="number"]{
  width:100%;
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text);
  font-family:'Share Tech Mono',monospace;
  font-size:18px;
  padding:14px 60px 14px 14px;
  border-radius:4px;
  -webkit-appearance:none;appearance:none;
  transition:border-color .15s, box-shadow .15s;
}
input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type="number"]{-moz-appearance:textfield}
input:focus{outline:0;border-color:var(--neon);box-shadow:0 0 0 3px var(--neon-glow)}
.unit{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  font-family:'Share Tech Mono',monospace;font-size:12px;
  color:var(--muted);letter-spacing:1px;pointer-events:none;
}

.toggle{
  display:grid;grid-template-columns:1fr 1fr;gap:0;
  background:var(--surface);border:1px solid var(--border);
  border-radius:4px;overflow:hidden;
}
.toggle button{
  background:transparent;border:0;color:var(--muted);
  font-family:'Share Tech Mono',monospace;font-size:11px;
  letter-spacing:1.5px;padding:10px 6px;cursor:pointer;
  text-transform:uppercase;transition:all .15s;
}
.toggle button.active{background:var(--neon);color:#000;font-weight:700}

.section-header{
  font-family:'Share Tech Mono',monospace;
  font-size:10px;color:var(--muted);
  letter-spacing:2px;text-transform:uppercase;
  margin:18px 0 10px;
  padding-bottom:4px;
  border-bottom:1px solid var(--border);
}

.calc-btn{
  width:100%;
  background:var(--neon);color:#000;
  border:0;border-radius:4px;
  font-family:'Barlow Condensed',sans-serif;
  font-weight:800;font-size:18px;
  text-transform:uppercase;letter-spacing:2px;
  padding:16px;cursor:pointer;
  margin-top:10px;
  box-shadow:0 0 20px var(--neon-glow);
  transition:transform .1s, box-shadow .15s;
}
.calc-btn:active{transform:scale(.98);box-shadow:0 0 32px var(--neon-glow)}

.results{margin-top:22px;display:none}
.results.show{display:block;animation:slideUp .35s ease both}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.result-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-top:2px solid var(--neon);
  padding:16px;
  margin-bottom:10px;
  position:relative;
}
.result-card .label{
  font-family:'Share Tech Mono',monospace;
  font-size:10px;color:var(--muted);
  letter-spacing:2px;text-transform:uppercase;
}
.result-card .value{
  font-family:'Share Tech Mono',monospace;
  font-size:32px;color:var(--neon);
  font-weight:400;
  margin-top:4px;line-height:1;
  text-shadow:0 0 14px var(--neon-glow);
}
.result-card .value .u{font-size:14px;color:var(--muted);margin-left:6px;text-shadow:none}
.result-card .sub{
  margin-top:8px;font-size:14px;color:var(--text);opacity:.7;
  font-family:'Share Tech Mono',monospace;
}
.result-card.zero .value{color:var(--amber);text-shadow:0 0 14px rgba(255,182,39,.3)}

.calc-detail{
  background:var(--bg-2);
  border:1px dashed var(--border);
  padding:12px;margin-top:12px;
  font-family:'Share Tech Mono',monospace;
  font-size:12px;color:var(--muted);line-height:1.6;
}
.calc-detail b{color:var(--neon);font-weight:400}
.calc-detail .calc{color:var(--text);display:block;margin-top:6px;word-break:break-word}

.warning{
  background:rgba(255,77,77,.08);
  border:1px solid var(--warn);
  border-left:3px solid var(--warn);
  padding:10px 12px;margin-top:10px;
  font-size:13px;color:var(--warn);
  font-family:'Share Tech Mono',monospace;
}
.info{
  background:rgba(255,182,39,.08);
  border:1px solid var(--amber);
  border-left:3px solid var(--amber);
  padding:10px 12px;margin-top:10px;
  font-size:13px;color:var(--amber);
  font-family:'Share Tech Mono',monospace;
  line-height:1.5;
}

footer{
  padding:18px 20px;border-top:1px solid var(--border);
  text-align:center;
  font-family:'Share Tech Mono',monospace;
  font-size:10px;color:var(--muted);
  letter-spacing:2px;text-transform:uppercase;
}
footer .v{color:var(--neon)}
::placeholder{color:#3a4842}
</style>
</head>
<body>
<div class="grain"></div>

<header>
  <div class="header-top">
    <div class="brand">
      <div class="logo">SMD</div>
      <div class="brand-text">
        <span class="top">S.M.D SOLUTIONS</span>
        <span class="bot" data-i18n="brand.subtitle">Aqueduc Tools</span>
      </div>
    </div>
    <div class="lang-toggle" role="group" aria-label="Language">
      <button type="button" class="active" data-lang="fr">FR</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </div>
  <h1>
    <span data-i18n="title.line1">Perte</span><br>
    <span class="accent" data-i18n="title.line2">Admissible</span>
  </h1>
</header>

<main>
  <div class="norm-section">
    <div class="section-label" data-i18n="norm.label">// Choix de la norme</div>
    <div class="select-wrap">
      <select id="normSelect"></select>
    </div>
  </div>

  <div class="norm-card" id="normCard"></div>

  <div class="section-header" id="paramsHeader" data-i18n="params.header">// Paramètres du test</div>

  <div class="field">
    <label for="diam" data-i18n="field.diameter">Diamètre nominal</label>
    <div class="input-wrap">
      <input type="number" id="diam" inputmode="decimal" step="0.5" min="0">
      <span class="unit" id="diamUnit">POUCES</span>
    </div>
  </div>

  <div class="field" id="lengthField">
    <label for="length" data-i18n="field.length">Longueur de conduite</label>
    <div class="input-wrap">
      <input type="number" id="length" inputmode="decimal" step="1" min="0">
      <span class="unit" id="lengthUnit">MÈTRES</span>
    </div>
  </div>

  <div class="field" id="jointsField">
    <label for="joints" data-i18n="field.joints">Nombre de joints</label>
    <div class="input-wrap">
      <input type="number" id="joints" inputmode="numeric" step="1" min="0">
      <span class="unit" id="jointsUnit">JOINTS</span>
    </div>
  </div>

  <div class="field-row" id="pressureRow">
    <div class="field">
      <label for="pressure" data-i18n="field.pressure">Pression test</label>
      <div class="input-wrap">
        <input type="number" id="pressure" inputmode="decimal" step="1" min="0">
        <span class="unit" id="punit">PSI</span>
      </div>
    </div>
    <div class="field">
      <label data-i18n="field.unit">Unité</label>
      <div class="toggle">
        <button type="button" class="active" data-punit="psi">PSI</button>
        <button type="button" data-punit="kpa">KPA</button>
      </div>
    </div>
  </div>

  <div class="field">
    <label for="duration" data-i18n="field.duration">Durée du test</label>
    <div class="input-wrap">
      <input type="number" id="duration" inputmode="decimal" step="0.25" min="0" value="2">
      <span class="unit" id="durationUnit">HEURES</span>
    </div>
  </div>

  <button class="calc-btn" id="calc" data-i18n="btn.calc">Calculer la perte admissible</button>

  <div class="results" id="results">
    <div class="result-card" id="totalCard">
      <div class="label" data-i18n="result.total">// Perte admissible totale</div>
      <div class="value" id="r-litres">—<span class="u">L</span></div>
      <div class="sub" id="r-gallons">—</div>
    </div>

    <div class="result-card" id="rateCard">
      <div class="label" data-i18n="result.rate">// Débit horaire</div>
      <div class="value" id="r-rate">—<span class="u">L/h</span></div>
      <div class="sub" id="r-rate-gph">—</div>
    </div>

    <div class="calc-detail" id="calcDetail"></div>
    <div id="messages"></div>
  </div>
</main>

<footer>
  smddesign.ca &nbsp;//&nbsp; <span class="v">v3.0</span>
</footer>

// ============ NORM CONFIG (formula-only norms get their formula from i18n) ============
const NORM_CONFIG = {
  'awwa-c600':           { group:'new',  formulaPlain:'L = (S × D × √P) / 148 000', needsLength:true,  needsJoints:false, needsPressure:true,  diamUnitKey:'unit.inches' },
  'awwa-c605-2013':      { group:'new',  formulaPlain:'L = (S × D × √P) / 148 000', needsLength:true,  needsJoints:false, needsPressure:true,  diamUnitKey:'unit.inches' },
  'awwa-c605-1994':      { group:'new',  formulaPlain:'L = (N × D × √P) / 7 400',   needsLength:false, needsJoints:true,  needsPressure:true,  diamUnitKey:'unit.inches' },
  'awwa-c605-si':        { group:'new',  formulaPlain:'L = (N × D × √P) / 130 400', needsLength:false, needsJoints:true,  needsPressure:true,  diamUnitKey:'unit.inches' },
  'awwa-c906':           { group:'new',  formulaFromI18n:true, needsLength:false, needsJoints:false, needsPressure:false, diamUnitKey:'unit.inches', zeroLeak:true },
  'astm-f1216-pressure': { group:'cipp', formulaFromI18n:true, needsLength:true,  needsJoints:false, needsPressure:false, diamUnitKey:'unit.inches' },
  'astm-f1216-gravity':  { group:'cipp', formulaFromI18n:true, needsLength:true,  needsJoints:false, needsPressure:false, diamUnitKey:'unit.inches' },
  'astm-f1743':          { group:'cipp', formulaFromI18n:true, needsLength:true,  needsJoints:false, needsPressure:false, diamUnitKey:'unit.inches' }
};

// ============ STATE ============
let pUnit = 'psi';
let currentNorm = 'awwa-c600';
let currentLang = 'fr';

// ============ DOM ============
const sel = document.getElementById('normSelect');
const card = document.getElementById('normCard');
const jointsField = document.getElementById('jointsField');
const lengthField = document.getElementById('lengthField');
const pressureRow = document.getElementById('pressureRow');
const punitLabel = document.getElementById('punit');
const diamUnitLabel = document.getElementById('diamUnit');
const lengthUnitLabel = document.getElementById('lengthUnit');
const jointsUnitLabel = document.getElementById('jointsUnit');
const durationUnitLabel = document.getElementById('durationUnit');

// ============ I18N HELPERS ============
function t(key){
  return I18N[currentLang][key] !== undefined ? I18N[currentLang][key] : key;
}

function applyTranslations(){
  document.documentElement.setAttribute('lang', t('html.lang'));
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.getAttribute('data-i18n'));
  });
  // Placeholders
  document.getElementById('diam').placeholder = t('placeholder.diameter');
  document.getElementById('length').placeholder = t('placeholder.length');
  document.getElementById('joints').placeholder = t('placeholder.joints');
  document.getElementById('pressure').placeholder = t('placeholder.pressure');
  document.getElementById('duration').placeholder = t('placeholder.duration');
  // Units
  lengthUnitLabel.textContent = t('unit.meters');
  jointsUnitLabel.textContent = t('unit.joints');
  durationUnitLabel.textContent = t('unit.hours');
  // Rebuild dropdown with translated labels and option text
  rebuildDropdown();
  // Re-render the norm card with new language
  renderNormCard();
}

function rebuildDropdown(){
  const previousValue = sel.value || currentNorm;
  sel.innerHTML = '';

  const groupNew = document.createElement('optgroup');
  groupNew.label = t('group.new');
  const groupCipp = document.createElement('optgroup');
  groupCipp.label = t('group.cipp');

  Object.keys(NORM_CONFIG).forEach(key => {
    const opt = document.createElement('option');
    opt.value = key;
    opt.textContent = I18N[currentLang].norms[key].title;
    if (NORM_CONFIG[key].group === 'new') groupNew.appendChild(opt);
    else groupCipp.appendChild(opt);
  });

  sel.appendChild(groupNew);
  sel.appendChild(groupCipp);
  sel.value = previousValue;
}

function renderNormCard(){
  const config = NORM_CONFIG[currentNorm];
  const i18nNorm = I18N[currentLang].norms[currentNorm];
  const formulaText = config.formulaFromI18n ? i18nNorm.formulaText : config.formulaPlain;

  const varsHTML = i18nNorm.vars.map(v =>
    `<div class="v"><span class="sym">${v[0]}</span><span class="def">${v[1]}</span></div>`
  ).join('');

  card.innerHTML = `
    <div class="norm-title">${i18nNorm.title}</div>
    <div class="norm-context">${i18nNorm.context}</div>
    <div class="norm-desc">${i18nNorm.desc}</div>
    <div class="norm-formula"><b class="neon">${formulaText}</b></div>
    <div class="var-list">${varsHTML}</div>
  `;

  jointsField.style.display = config.needsJoints ? '' : 'none';
  lengthField.style.display = config.needsLength ? '' : 'none';
  pressureRow.style.display = config.needsPressure ? '' : 'none';
  diamUnitLabel.textContent = t(config.diamUnitKey);
}

// ============ EVENT HANDLERS ============
sel.addEventListener('change', () => {
  currentNorm = sel.value;
  renderNormCard();
  document.getElementById('results').classList.remove('show');
});

document.querySelectorAll('.toggle button[data-punit]').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.toggle button[data-punit]').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  pUnit = b.dataset.punit;
  punitLabel.textContent = pUnit.toUpperCase();
}));

document.querySelectorAll('.lang-toggle button').forEach(b => b.addEventListener('click', () => {
  if (b.classList.contains('active')) return;
  document.querySelectorAll('.lang-toggle button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  currentLang = b.dataset.lang;
  try { localStorage.setItem('smd-lang', currentLang); } catch(e){}
  applyTranslations();
  document.getElementById('results').classList.remove('show');
}));

// ============ CALCULATIONS ============
function fmt(n, d = 2) {
  if (!isFinite(n)) return '—';
  if (n === 0) return '0';
  if (Math.abs(n) < 0.01) return n.toExponential(2);
  const locale = currentLang === 'fr' ? 'fr-CA' : 'en-CA';
  return n.toLocaleString(locale, { minimumFractionDigits: d, maximumFractionDigits: d });
}

function showError(msg){
  document.getElementById('messages').innerHTML = `<div class="warning">⚠ ${msg}</div>`;
  document.getElementById('r-litres').innerHTML = '—<span class="u">L</span>';
  document.getElementById('r-gallons').textContent = '—';
  document.getElementById('r-rate').innerHTML = `—<span class="u">${t('calc.lph')}</span>`;
  document.getElementById('r-rate-gph').textContent = '—';
  document.getElementById('calcDetail').innerHTML = '';
  document.getElementById('results').classList.add('show');
}

function showMsg(html, type='warning'){
  document.getElementById('messages').innerHTML += `<div class="${type}">${html}</div>`;
}

document.getElementById('calc').addEventListener('click', () => {
  const config = NORM_CONFIG[currentNorm];
  const i18nNorm = I18N[currentLang].norms[currentNorm];

  const Dpo = parseFloat(document.getElementById('diam').value);
  const Lm = parseFloat(document.getElementById('length').value);
  const N = parseFloat(document.getElementById('joints').value);
  const Pin = parseFloat(document.getElementById('pressure').value);
  const T = parseFloat(document.getElementById('duration').value);

  const messages = [];
  document.getElementById('messages').innerHTML = '';
  document.getElementById('results').classList.remove('show');

  if (!(Dpo > 0)) return showError(t('err.diameter'));
  if (!(T > 0)) return showError(t('err.duration'));
  if (config.needsLength && !(Lm > 0)) return showError(t('err.length'));
  if (config.needsJoints && !(N > 0)) return showError(t('err.joints'));
  if (config.needsPressure && !(Pin > 0)) return showError(t('err.pressure'));

  const Ppsi = pUnit === 'psi' ? Pin : Pin / PSI_TO_KPA;
  const PkPa = pUnit === 'kpa' ? Pin : Pin * PSI_TO_KPA;
  const Lft = Lm ? Lm * M_TO_FT : 0;
  const Dmm = Dpo * IN_TO_MM;

  let gph = 0, lph = 0, calcHTML = '', isZero = false;
  const inUnit = t('calc.in_short');
  const dayLabel = t('calc.day');

  switch(currentNorm){
    case 'awwa-c600':
    case 'awwa-c605-2013': {
      gph = (Lft * Dpo * Math.sqrt(Ppsi)) / 148000;
      lph = gph * G_TO_L;
      calcHTML = `<b>${i18nNorm.title}</b><br>
        L = (S × D × √P) / 148 000<br>
        <span class="calc">= (${fmt(Lft,1)} ft × ${fmt(Dpo,2)} ${inUnit} × √${fmt(Ppsi,1)} psi) / 148 000<br>
        = ${fmt(gph,4)} ${t('calc.gph')} = ${fmt(lph,3)} ${t('calc.lph')}</span>`;
      if (T < 2) messages.push(t('msg.min2h'));
      break;
    }
    case 'awwa-c605-1994': {
      gph = (N * Dpo * Math.sqrt(Ppsi)) / 7400;
      lph = gph * G_TO_L;
      calcHTML = `<b>${i18nNorm.title}</b><br>
        L = (N × D × √P) / 7 400<br>
        <span class="calc">= (${fmt(N,0)} × ${fmt(Dpo,2)} ${inUnit} × √${fmt(Ppsi,1)} psi) / 7 400<br>
        = ${fmt(gph,4)} ${t('calc.gph')} = ${fmt(lph,3)} ${t('calc.lph')}</span>`;
      if (T < 2) messages.push(t('msg.min2h_c605'));
      break;
    }
    case 'awwa-c605-si': {
      lph = (N * Dmm * Math.sqrt(PkPa)) / 130400;
      gph = lph / G_TO_L;
      calcHTML = `<b>${i18nNorm.title}</b><br>
        L = (N × D × √P) / 130 400<br>
        <span class="calc">= (${fmt(N,0)} × ${fmt(Dmm,1)} mm × √${fmt(PkPa,1)} kPa) / 130 400<br>
        = ${fmt(lph,4)} ${t('calc.lph')} = ${fmt(gph,4)} ${t('calc.gph')}</span>`;
      if (T < 2) messages.push(t('msg.min2h_si'));
      break;
    }
    case 'awwa-c906': {
      gph = 0; lph = 0; isZero = true;
      calcHTML = `<b>${i18nNorm.title}</b><br>
        ${t('calc.no_formula')}<br>
        <span class="calc">${t('calc.c906_explain')}</span>`;
      messages.push(t('msg.c906_info'));
      break;
    }
    case 'astm-f1216-pressure':
    case 'astm-f1743': {
      const galPerDay = 20 * Dpo * (Lft / MILE_FT);
      gph = galPerDay / 24;
      lph = gph * G_TO_L;
      calcHTML = `<b>${i18nNorm.title}</b><br>
        L = 20 gal × ${inUnit}(D) × mile × ${dayLabel}⁻¹<br>
        <span class="calc">= 20 × ${fmt(Dpo,2)} × (${fmt(Lft,1)} ft / 5 280 ft/mi) / 24 h<br>
        = ${fmt(galPerDay,4)} gal/${dayLabel} = ${fmt(gph,4)} ${t('calc.gph')} = ${fmt(lph,3)} ${t('calc.lph')}</span>`;
      if (T < 1) messages.push(t('msg.min1h_astm'));
      break;
    }
    case 'astm-f1216-gravity': {
      const galPerDay = 50 * Dpo * (Lft / MILE_FT);
      gph = galPerDay / 24;
      lph = gph * G_TO_L;
      calcHTML = `<b>${i18nNorm.title}</b><br>
        L = 50 gal × ${inUnit}(D) × mile × ${dayLabel}⁻¹<br>
        <span class="calc">= 50 × ${fmt(Dpo,2)} × (${fmt(Lft,1)} ft / 5 280 ft/mi) / 24 h<br>
        = ${fmt(galPerDay,4)} gal/${dayLabel} = ${fmt(gph,4)} ${t('calc.gph')} = ${fmt(lph,3)} ${t('calc.lph')}</span>`;
      if (T < 1) messages.push(t('msg.min1h_grav'));
      if (Dpo > 36) messages.push(t('msg.diam36'));
      break;
    }
  }

  const totalGal = gph * T;
  const totalL = totalGal * G_TO_L;

  document.getElementById('totalCard').classList.toggle('zero', isZero);
  document.getElementById('rateCard').classList.toggle('zero', isZero);

  document.getElementById('r-litres').innerHTML = `${fmt(totalL,2)}<span class="u">L</span>`;
  document.getElementById('r-gallons').textContent = `${fmt(totalGal,3)} ${t('calc.gallons_over')} ${fmt(T,2)} ${t('calc.h')}`;
  document.getElementById('r-rate').innerHTML = `${fmt(lph,3)}<span class="u">${t('calc.lph')}</span>`;
  document.getElementById('r-rate-gph').textContent = `${fmt(gph,4)} ${t('calc.gph')}`;

  let convNote = '';
  if (config.needsLength && Lm) convNote += `${fmt(Lm,1)} m = ${fmt(Lft,1)} ft`;
  if (config.needsPressure && Pin) {
    if (convNote) convNote += ' · ';
    convNote += `${fmt(Ppsi,1)} psi = ${fmt(PkPa,1)} kPa`;
  }
  if (convNote) calcHTML += `<br><span style="color:var(--muted)">${t('calc.conv')} ${convNote}</span>`;

  document.getElementById('calcDetail').innerHTML = calcHTML;

  // C906 message goes in the amber "info" box, others in red "warning"
  messages.forEach(m => {
    const isInfo = (currentNorm === 'awwa-c906');
    showMsg('⚠ ' + m, isInfo ? 'info' : 'warning');
  });

  document.getElementById('results').classList.add('show');
  document.getElementById('results').scrollIntoView({behavior:'smooth', block:'start'});
});

// ============ INIT ============
try {
  const saved = localStorage.getItem('smd-lang');
  if (saved && (saved === 'fr' || saved === 'en')) {
    currentLang = saved;
    document.querySelectorAll('.lang-toggle button').forEach(b => {
      b.classList.toggle('active', b.dataset.lang === currentLang);
    });
  }
} catch(e){}

applyTranslations();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
